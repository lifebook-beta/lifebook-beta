name: Build LifeBook Beta APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LifeBookBeta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Show APK SHA-1 and SHA-256
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)

          echo "=========================================="
          echo "APK FOUND:"
          echo "$APK"
          echo "=========================================="

          echo ""
          echo "========== SHA-1 / SHA-256 =========="

          keytool -printcert -jarfile "$APK"

          echo ""
          echo "=========================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: LifeBookBeta/build/app/outputs/flutter-apk/*.apk
