name: Build LifeBook Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          echo "Checking Flutter project..."

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found!"
            exit 1
          }

          echo "Flutter project found."

      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Generating Android platform..."

            flutter create \
              --platforms=android \
              --project-name=lifebook_beta \
              .

          else
            echo "Android folder already exists."
          fi

          echo "Android platform ready."

      - name: Setup Firebase
        shell: bash
        run: |
          set -e

          echo "Setting up Firebase..."

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found in repository root!"
            exit 1
          fi

          mkdir -p android/app

          cp google-services.json android/app/google-services.json

          echo "Firebase configuration copied."

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -e

          echo "Configuring Google Services plugin..."

          python3 <<'PY'
          from pathlib import Path

          root = Path("android")

          # -------------------------------------------------
          # 1. Configure root Gradle file
          # -------------------------------------------------

          root_gradle = root / "build.gradle"

          if root_gradle.exists():
              text = root_gradle.read_text()

              if "com.google.gms:google-services" not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          """dependencies {
                              classpath 'com.google.gms:google-services:4.4.4'""",
                          1
                      )
                  else:
                      text = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
                  classpath 'com.google.gms:google-services:4.4.4'
              }
          }

          """ + text

                  root_gradle.write_text(text)

          # -------------------------------------------------
          # 2. Configure app Gradle file
          # -------------------------------------------------

          app_gradle = root / "app" / "build.gradle"

          if app_gradle.exists():
              text = app_gradle.read_text()

              if "com.google.gms.google-services" not in text:
                  text += """

          apply plugin: 'com.google.gms.google-services'
          """

                  app_gradle.write_text(text)

          # -------------------------------------------------
          # 3. Configure Kotlin DSL files if present
          # -------------------------------------------------

          settings_kts = root / "settings.gradle.kts"
          app_kts = root / "app" / "build.gradle.kts"

          if settings_kts.exists():
              text = settings_kts.read_text()

              if "com.google.gms.google-services" not in text:
                  marker = 'plugins {'

                  if marker in text:
                      text = text.replace(
                          marker,
                          """plugins {
              id("com.google.gms.google-services") version "4.4.4" apply false""",
                          1
                      )

                      settings_kts.write_text(text)

          if app_kts.exists():
              text = app_kts.read_text()

              if 'id("com.google.gms.google-services")' not in text:
                  marker = "plugins {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          """plugins {
              id("com.google.gms.google-services")""",
                          1
                      )

                      app_kts.write_text(text)

          print("Google Services configuration completed.")
          PY

      - name: Flutter Clean
        shell: bash
        run: |
          set -e
          flutter clean

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          echo "Getting Flutter dependencies..."

          flutter pub get

          echo "Dependencies installed."

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Building LifeBook Beta APK..."

          flutter build apk --release

          echo "APK build completed."

      - name: Show APK SHA-1 and SHA-256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "LIFEBOOK BETA APK"
          echo "========================================"

          echo ""
          echo "APK SHA-1:"
          sha1sum "$APK"

          echo ""
          echo "APK SHA-256:"
          sha256sum "$APK"

          echo ""
          echo "APK location:"
          echo "$APK"

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
