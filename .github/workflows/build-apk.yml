name: Build LifeBook Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Check project
      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found!"
            exit 1
          fi

          echo "Flutter project OK."

      # 5. Generate Android
      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Generating Android platform..."

            flutter create \
              --platforms=android \
              --project-name=lifebook_beta \
              .
          else
            echo "Android folder already exists."
          fi

      # 6. Fix Android package name
      - name: Fix Android Package Name
        shell: bash
        run: |
          set -e

          echo "Setting Android package name..."

          sed -i 's/applicationId = ".*"/applicationId = "com.lifebookbeta.app"/' \
            android/app/build.gradle.kts

          sed -i 's/namespace = ".*"/namespace = "com.lifebookbeta.app"/' \
            android/app/build.gradle.kts

          echo "Package name:"
          grep -E 'namespace|applicationId' \
            android/app/build.gradle.kts

      # 7. Setup Firebase
      - name: Setup Firebase
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          if [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "android/app/google-services.json"

            echo "Firebase configuration copied."
          else
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

      # 8. Configure Google Services plugin
      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -e

          echo "Configuring Google Services plugin..."

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.2" apply false'''
              )

          settings.write_text(text)

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")'''
              )

          build.write_text(text)

          print("Google Services plugin configured.")
          PY

      # 9. Flutter clean
      - name: Flutter Clean
        shell: bash
        run: |
          set -e
          flutter clean

      # 10. Pub get
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e
          flutter pub get

      # 11. Build APK
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Building LifeBook Beta APK..."

          flutter build apk --release

          echo "APK build completed."

      # 12. SHA fingerprints
      - name: Show APK SHA-1 and SHA-256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "========================================"
          echo "LIFEBOOK BETA APK"
          echo "========================================"

          echo ""
          echo "APK SHA-1:"
          sha1sum "$APK"

          echo ""
          echo "APK SHA-256:"
          sha256sum "$APK"

          echo ""
          echo "APK location:"
          echo "$APK"

          echo "========================================"

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
