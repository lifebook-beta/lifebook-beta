name: Build LifeBook Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Flutter project OK"

      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --project-name=lifebook_beta \
              .
          fi

          echo "Android platform ready"

      - name: Configure Android Kotlin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          s = p.read_text()

          s = s.replace(
              "id 'org.jetbrains.kotlin.android' version '2.1.0' apply false",
              "id 'org.jetbrains.kotlin.android' version '2.1.20' apply false"
          )

          p.write_text(s)
          PY

          echo "Kotlin configuration checked"

      - name: Setup Firebase
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          if [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "android/app/google-services.json"

          elif [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" \
              "android/app/google-services.json"

          else
            echo "WARNING: google-services.json not found"
          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Show APK SHA-1 and SHA-256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========================================"
          echo "APK SHA-1"
          echo "========================================"
          sha1sum "$APK"

          echo "========================================"
          echo "APK SHA-256"
          echo "========================================"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
