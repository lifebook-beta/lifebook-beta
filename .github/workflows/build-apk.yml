name: Build LifeBook Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Check Flutter project
      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: lib folder not found!"
            exit 1
          fi

          echo "Flutter project found."

      # Generate Android project files if missing
      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Generating Android platform files..."

            flutter create \
              --platforms=android \
              --project-name=lifebook_beta \
              .

          else
            echo "Android folder already exists."
          fi

      # Setup Firebase configuration
      - name: Setup Firebase
        shell: bash
        run: |
          set -e

          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp "google-services.json" "android/app/google-services.json"
            echo "Firebase google-services.json copied."
          elif [ -f "google-services (1).json" ]; then
            mkdir -p android/app
            cp "google-services (1).json" "android/app/google-services.json"
            echo "Firebase google-services.json copied."
          else
            echo "WARNING: google-services.json not found."
          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Show APK SHA-1 and SHA-256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "========================================"
          echo "APK SHA-1"
          echo "========================================"
          sha1sum "$APK"

          echo "========================================"
          echo "APK SHA-256"
          echo "========================================"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
