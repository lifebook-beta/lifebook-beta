name: Build LifeBook Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          echo "Checking Flutter project..."

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found!"
            exit 1
          fi

          echo "Flutter project found successfully."

      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          echo "Checking Android platform..."

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Generating Android platform..."

            flutter create \
              --platforms=android \
              --project-name=lifebook_beta \
              .

          else
            echo "Android folder already exists."
          fi

          echo "Android platform ready."

      - name: Setup Firebase
        shell: bash
        run: |
          set -e

          echo "Setting up Firebase..."

          mkdir -p android/app

          if [ -f "google-services.json" ]; then

            cp "google-services.json" \
              "android/app/google-services.json"

            echo "Firebase configuration copied."

          elif [ -f "google-services (1).json" ]; then

            cp "google-services (1).json" \
              "android/app/google-services.json"

            echo "Firebase configuration copied."

          else

            echo "WARNING: google-services.json not found."

          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          echo "Cleaning Flutter project..."
          flutter clean

          echo "Getting Flutter dependencies..."
          flutter pub get

          echo "Dependencies installed successfully."

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Building LifeBook Beta APK..."

          flutter build apk --release

          echo "APK build completed."

      - name: Show APK SHA-1 and SHA-256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "LIFEBOOK BETA APK"
          echo "========================================"

          echo ""
          echo "APK SHA-1:"
          sha1sum "$APK"

          echo ""
          echo "APK SHA-256:"
          sha256sum "$APK"

          echo ""
          echo "APK location:"
          echo "$APK"

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
